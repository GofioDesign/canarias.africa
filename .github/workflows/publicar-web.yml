# Publica web/ en GitHub Pages cada vez que cambia main, cada 6 horas (votos de GitHub y catálogo) y cuando
# /admin pide publicar (workflow_dispatch). Copia el catálogo del servidor a /datos/: la web y uMap leen esa copia.
# Requisitos (una vez): Settings → Pages → Source: «GitHub Actions», y crear la etiqueta «propuesta».
name: Publicar la web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # el árbol de modificaciones de cada ficha sale del historial de git
      - name: Comprobar que el catálogo no publica ubicaciones sensibles
        run: python3 scripts/comprobar-catalogo.py
      - name: Pillow y la fuente Inter para las imágenes de compartir (sin ellas se usa la de la portada)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil fonts-inter
      - name: Comprobar que las fichas y los estratos se generan
        run: python3 scripts/generar-fichas.py
      - name: Comprobar las propuestas
        run: python3 scripts/propuestas.py --comprobar

  publicar:
    if: github.event_name != 'pull_request'
    needs: comprobar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # el árbol de modificaciones de cada ficha sale del historial de git
      - uses: actions/configure-pages@v5
      # Si api.canarias.africa no responde, la publicación sigue sin la copia (la web lee del servidor) en vez de
      # quedarse colgada: el 2026-11-02 este paso se quedó esperando más de 7 minutos y bloqueó todas las publicaciones.
      - name: Copiar el catálogo del servidor (obras, QR, rutas, artistas) a canarias.africa/datos/
        timeout-minutes: 3
        continue-on-error: true
        run: python3 scripts/catalogo-servidor.py
      - name: Comprobar que la copia no publica ubicaciones sensibles
        run: python3 scripts/comprobar-catalogo.py
      - name: Pillow y la fuente Inter para las imágenes de compartir (sin ellas se usa la de la portada)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil fonts-inter
      - name: Fichas estáticas, estratos de archive.org, páginas de soporte, imágenes de compartir y sitemap
        timeout-minutes: 15
        run: python3 scripts/generar-fichas.py
      - name: Generar propuestas.json y abrir el debate de las propuestas nuevas
        run: python3 scripts/propuestas.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
