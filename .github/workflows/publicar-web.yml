# Publica web/ en GitHub Pages cada vez que cambia main.
# Requisito (una vez): Settings → Pages → Source: «GitHub Actions».
name: Publicar la web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que el catálogo no publica ubicaciones sensibles
        run: python3 scripts/comprobar-catalogo.py

  publicar:
    if: github.event_name != 'pull_request'
    needs: comprobar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
