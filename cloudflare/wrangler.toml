# Worker de canarias.africa en Cloudflare (plan gratuito).
# La web estática (../web) se sirve como «assets» del mismo Worker.
name = "canarias-africa"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [{ pattern = "canarias.africa", custom_domain = true }]

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/q/*", "/teselas/*", "/datos/umap/*"]

[[d1_databases]]
binding = "DB"
database_name = "canarias-africa"
database_id = "PENDIENTE"            # lo da: wrangler d1 create canarias-africa

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "canarias-fotos"

[[kv_namespaces]]
binding = "UMAP"
id = "PENDIENTE"                     # lo da: wrangler kv namespace create UMAP

[triggers]
crons = ["7 * * * *"]                # copia las capas de uMap cada hora

[vars]
UMAP_SERVIDOR = "https://umap.openstreetmap.fr/es"
UMAP_MAPA = ""
UMAP_CAPA_QR = ""
UMAP_CAPA_RUTAS = ""
CONTACTO = "hola@canarias.africa"
ACCESS_EQUIPO = ""                   # nombre del equipo de Cloudflare Zero Trust
ACCESS_AUD = ""                      # «Application Audience» de la aplicación de Access que protege /admin y /api/admin
ADMINS = ""                          # correos con permiso de moderación, separados por comas
