# nginx para canarias.africa (Debian, nginx + certbot instalados con apt).
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled.
# Los certificados los crea: certbot --nginx -d canarias.africa -d www.canarias.africa

# Caché de teselas de OpenStreetMap: se llena con las visitas, nunca con descargas en bloque
# (https://operations.osmfoundation.org/policies/tiles/).
proxy_cache_path /var/cache/nginx/teselas levels=1:2 keys_zone=teselas:20m
                 max_size=5g inactive=60d use_temp_path=off;

# Límite de envíos a la API (formularios) por IP.
limit_req_zone $binary_remote_addr zone=formularios:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name canarias.africa www.canarias.africa;
  return 301 https://canarias.africa$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.canarias.africa;
  ssl_certificate     /etc/letsencrypt/live/canarias.africa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/canarias.africa/privkey.pem;
  return 301 https://canarias.africa$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name canarias.africa;
  ssl_certificate     /etc/letsencrypt/live/canarias.africa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/canarias.africa/privkey.pem;

  root /srv/canarias.africa/web;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Datos que cambian a menudo: sin caché en el navegador.
  location ~ ^/(convocatorias\.json|datos/) {
    add_header Cache-Control "no-cache";
  }

  location /teselas/osm/ {
    proxy_pass https://tile.openstreetmap.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.openstreetmap.org;
    # Poner aquí el correo real del proyecto antes de activar.
    proxy_set_header User-Agent "canarias.africa tile cache (contacto: hola@canarias.africa)";
    proxy_cache teselas;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_hide_header Set-Cookie;
    add_header X-Cache $upstream_cache_status;
    expires 30d;
  }

  # QR impresos en las obras: https://canarias.africa/q/<código>
  location /q/ {
    proxy_pass http://127.0.0.1:8090;
  }

  # API (PocketBase). El panel de administración /_/ solo desde la IP propia o por túnel SSH.
  location /api/ {
    client_max_body_size 15m;
    limit_req zone=formularios burst=20 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /_/ {
    return 404;
  }
}
